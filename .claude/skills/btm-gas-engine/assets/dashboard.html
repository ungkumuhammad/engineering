<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTM Gas Engine Project Dashboard</title>
<style>
:root{--ink:#1c2230;--muted:#5d6678;--faint:#8a93a5;--line:#dfe3ea;--bg:#f5f6f8;--card:#fff;--accent:#2a62c9;--accent-soft:#e8effc;--amber:#b7790a;--amber-soft:#fdf3df;--green:#1b8a4c;--green-soft:#e3f4ea;--red:#c23b3b;--red-soft:#fbe8e8;--teal:#0f7f84;--violet:#6b4fbb;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9c1cf}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2156b3}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.dirty{font-size:12px;color:var(--amber);font-weight:600}
.saved{font-size:12px;color:var(--green)}
.stages{display:flex;gap:6px;padding:0 18px 10px;overflow-x:auto}
.stg{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;cursor:pointer;text-align:left}
.stg .t{font-size:12px;color:var(--muted)}
.stg .n{font-weight:600}
.stg .pb{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.stg .pb i{display:block;height:100%;background:var(--accent)}
.stg.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stg.complete .pb i{background:var(--green)}
.stg.skipped{opacity:.75}
.stg.skipped .pb i{background:var(--faint)}
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-top:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:18px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card>h3,.card>h2{margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--faint)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:20px;white-space:nowrap}
.chip.ok,.chip.Pass,.chip.Done,.chip.complete,.chip.Received,.chip.Approved{background:var(--green-soft);color:var(--green)}
.chip.bad,.chip.Fail,.chip.Declined{background:var(--red-soft);color:var(--red)}
.chip.warn,.chip.Unknown,.chip.Partial,.chip.in_progress,.chip.Fallback,.chip.Needs,.chip.default{background:var(--amber-soft);color:var(--amber)}
.chip.na,.chip.not_started,.chip.skipped{background:#eef0f4;color:var(--muted)}
.chip.src{background:#eef0f4;color:var(--muted);font-weight:500}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table input,table select,table textarea{width:100%;min-width:60px;border:1px solid transparent;border-radius:6px;padding:3px 5px;background:transparent}
table input:hover,table select:hover,table textarea:hover{border-color:var(--line)}
table input:focus,table select:focus,table textarea:focus{border-color:var(--accent);outline:none;background:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 22px}
.fld{padding:8px 0;border-bottom:1px dashed var(--line)}
.fld label.l{display:flex;gap:6px;align-items:baseline;font-weight:550;font-size:13px}
.fld .req{color:var(--red)}
.fld .row{display:flex;gap:6px;align-items:center;margin-top:4px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{flex:1;width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
.fld textarea{min-height:56px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fld .help{font-size:12px;color:var(--faint);margin-top:3px}
.fld .fb{font-size:12px;color:var(--amber);margin-top:3px}
.fld.unk input,.fld.unk select,.fld.unk textarea{background:var(--amber-soft)}
.fld .u{font-size:12px;color:var(--muted);white-space:nowrap}
.fld .multi{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.fld .multi label,.chk{display:flex;gap:6px;align-items:center;font-weight:400;font-size:13px;cursor:pointer}
.unkbtn{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:3px 6px;cursor:pointer;color:var(--muted)}
.unkbtn.on{background:var(--amber-soft);color:var(--amber);border-color:#f0d9a8}
.grp{margin-top:18px}
.grp>h4{margin-bottom:4px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.note.amber{background:var(--amber-soft)}
.note.red{background:var(--red-soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff}
.opt.best{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.opt h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.opt dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0 0;font-size:12.5px}
.opt dt{color:var(--muted)}.opt dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-size:11px;fill:var(--muted)}
svg.ch .ax{stroke:#c4cad6}
svg.ch .gl{stroke:#eceff4}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.box{height:10px;width:10px}
.heat{width:100%;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line)}
.drop{border:2px dashed #c9d0dc;border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);background:#fbfcfd}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar label{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.toolbar select,.toolbar input[type=text]{border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:#fff}
.md{font-size:13.5px}
.md h1{font-size:20px;margin:6px 0 10px}.md h2{font-size:16px;margin:16px 0 6px}.md h3{font-size:14px;margin:12px 0 4px}
.md table{margin:6px 0 12px}.md p{margin:6px 0}.md ul{margin:4px 0 8px;padding-left:22px}
.md code{background:#f0f2f6;padding:0 4px;border-radius:4px}
.modal-bg{position:fixed;inset:0;background:rgba(20,26,38,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:18px;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:8px}
.modal textarea,.modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;z-index:60;font-size:13px;max-width:90vw}
.toast.err{background:var(--red)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub .btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv b{font-weight:550;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.welcome{max-width:760px;margin:30px auto}
.welcome .card{padding:24px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;background:#fff}
@media (max-width:700px){.g2{grid-template-columns:1fr}main{padding:10px}.form{grid-template-columns:1fr}}
@media print{.top,.btn,.toolbar,.drop{display:none!important}main{max-width:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand">BTM Gas Engine · Project dashboard<small id="projname">No project open</small></div>
    <div class="spacer"></div>
    <span id="dirty"></span>
    <button class="btn" data-act="new">New project</button>
    <button class="btn" data-act="open">Open project file</button>
    <button class="btn primary" data-act="save" id="savebtn" disabled>Save project file</button>
    <input type="file" id="openfile" accept=".json,application/json" hidden>
  </div>
  <div class="stages" id="stages"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<main id="main"></main>
<div id="modal"></div>
<script>/*
 * BTM gas engine project engine.
 *
 * One file shared by the dashboard (inlined into assets/dashboard.html by
 * build_dashboard.mjs) and the command line tool (btm.mjs). It holds the
 * project file format, the stage and question catalogue, load data import,
 * and every calculation for the Stage 3 exercises, so the agent and the
 * dashboard always produce the same numbers.
 *
 * Formulas follow the BTM Gas Engine Playbook and its sizing calculator.
 * No dependencies. Works in Node (CommonJS) and in the browser (window.BTM).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.BTM = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var SCHEMA = 'btm-gas-engine-project';
  var VERSION = 1;
  var SQRT3 = Math.sqrt(3);
  var MMBTU_PER_MWH = 3.412;
  var LHV_TO_HHV = 1.108;

  // ---------------------------------------------------------------------------
  // Defaults (sizing calculator example values from the playbook)
  // ---------------------------------------------------------------------------
  var CALC_DEFAULTS = {
    target: 10, red: 'N+1', pf: 0.8, peak: 15, minload: 5, ambient: 35, alt: 50, mn: 75, override: null,
    vconn: 11, ifault: 9, rating: 16, xd: 15, zt: 7, lhv: 9.7, gas: 6, tariff: 120, cf: 85, avail: 95, req: 95,
    run_mode: 'economic', run_hours: '0-24', run_days: 'all', import_margin_mw: 0.5, demand_credit_pct: 50,
    years: 15, discount_pct: 10, tariff_esc_pct: 2, gas_esc_pct: 2, om_esc_pct: 2, ppa_irr_pct: 12,
    contingency_pct: 10, switchgear_upgrade: 0, gas_connection: 0, heat_recovery: 0, development: 0,
    staff_per_yr: 0, insurance_pct: 0.5, heat_frac: 42, boiler_eff: 90, motor_ka: 0
  };

  var ENGINE_CLASSES = [
    { mw: 1.0, eff: 40.5, min: 50, kv: 0.4, om: 18, cx: 1500 },
    { mw: 2.0, eff: 42.0, min: 50, kv: 0.69, om: 15, cx: 1350 },
    { mw: 3.3, eff: 43.0, min: 50, kv: 11, om: 13, cx: 1250 },
    { mw: 4.5, eff: 44.0, min: 50, kv: 11, om: 11, cx: 1150 },
    { mw: 10, eff: 46.5, min: 50, kv: 11, om: 9, cx: 1050 }
  ];

  // ---------------------------------------------------------------------------
  // Question catalogue. One entry per field. Keys are flat dotted strings
  // stored in project.fields. req = needed to complete the stage
  // (an answer of "unknown" with a note also counts).
  // ---------------------------------------------------------------------------
  function f(k, l, t, o) {
    o = o || {};
    return { k: k, l: l, t: t, u: o.u || '', req: !!o.req, opts: o.opts || null, help: o.help || '', fb: o.fb || '', calc: o.calc || null };
  }
  var YNU = ['Yes', 'No', 'Unknown'];

  var STAGES = [
    {
      n: 0, key: 'prep', short: 'Prepare', title: 'Stage 0 · Before the first meeting', when: 'Week 0 (about 1 week)',
      goal: 'Do the desk research, send a short pre-meeting request, and build a first hypothesis so you walk into the meeting with a ballpark.',
      groups: [
        { title: 'Project and people', fields: [
          f('meta.project_name', 'Project name', 'text', { req: 1, help: 'Short name used for the file, e.g. "ACME Plant 2 BTM".' }),
          f('client.name', 'Client company', 'text', { req: 1 }),
          f('client.industry', 'Industry', 'text', { req: 1, help: 'e.g. food processing, glove manufacturing, data centre.' }),
          f('client.site_name', 'Site name', 'text'),
          f('client.contact', 'Main client contact (name, role)', 'text'),
          f('team.tsm', 'Technical solution manager (you)', 'text', { req: 1 }),
          f('team.account_lead', 'Account or sales lead', 'text'),
          f('meeting.date', 'Target date for the discovery meeting', 'date'),
          f('meta.currency', 'Currency for all prices', 'text', { req: 1, help: 'ISO code, e.g. USD, MYR, EUR. All prices in the file use it.' })
        ] },
        { title: 'Site location and climate', fields: [
          f('site.city', 'City or town', 'text', { req: 1 }),
          f('site.country', 'Country', 'text', { req: 1, help: 'Sets the utility rules, permits and tariff to research.' }),
          f('site.altitude_m', 'Site altitude', 'number', { u: 'm', req: 1, calc: 'alt', help: 'Above 500 m the engine derates about 1% per 100 m.', fb: 'Read it from a topographic map or an elevation website for the address.' }),
          f('site.hot_day_temp_c', 'Hot-day air temperature', 'number', { u: '°C', req: 1, calc: 'ambient', help: 'Design hot-day (about 1% exceedance). Above 30 °C the engine derates about 1% per °C.', fb: 'Use the nearest weather station design temperature (ASHRAE 1% cooling) or the client\'s HVAC design basis.' }),
          f('site.notes', 'Site notes (access, neighbours, flood risk)', 'textarea')
        ] },
        { title: 'Utility and tariff', fields: [
          f('utility.name', 'Electricity utility', 'text', { req: 1 }),
          f('tariff.class', 'Tariff class or category', 'text', { req: 1, help: 'From the regulator\'s published tariff book or the supply contract.' }),
          f('tariff.energy_rate', 'Average energy charge', 'number', { u: 'per MWh', req: 1, calc: 'tariff', help: 'Energy part only, in the project currency per MWh. Time-of-use bands go in the Tariff tab.', fb: 'Use the regulator\'s published tariff for the class. Show payback at ±15%.' }),
          f('tariff.demand_charge', 'Demand (maximum demand) charge', 'number', { u: 'per kW-month', help: 'Leave empty if the tariff has none.' }),
          f('tariff.has_tou', 'Time-of-use (peak / off-peak) rates?', 'select', { opts: YNU }),
          f('tariff.source', 'Where the tariff came from', 'text')
        ] },
        { title: 'Gas', fields: [
          f('gas.availability', 'Gas availability at the site', 'select', { req: 1, opts: ['Pipeline at site', 'Pipeline nearby', 'No pipeline (CNG or LNG needed)', 'Unknown'], help: 'The biggest project risk. Check the gas network map.' }),
          f('gas.distributor', 'Gas distributor or supplier', 'text'),
          f('gas.price_per_mmbtu', 'Indicative gas price (HHV)', 'number', { u: 'per MMBtu', req: 1, calc: 'gas', fb: 'Use the published regulated industrial gas tariff, or a recent supplier quote for a similar user.' }),
          f('gas.lhv_kwh_nm3', 'Gas heating value (LHV)', 'number', { u: 'kWh/Nm³', calc: 'lhv', help: 'Typical pipeline gas 9.5 to 10.' }),
          f('gas.methane_number', 'Gas methane number', 'number', { calc: 'mn', help: 'Below 70 the engine derates. Typical pipeline gas 70 to 90.' })
        ] },
        { title: 'Rules and permits (desk research)', fields: [
          f('reg.parallel_allowed', 'Does the utility allow generation in parallel with the grid?', 'select', { req: 1, opts: ['Yes', 'Yes, with conditions', 'No', 'Unknown'] }),
          f('reg.export_allowed', 'Is export to the grid allowed?', 'select', { opts: ['Yes', 'With a separate agreement', 'No', 'Unknown'] }),
          f('reg.licence', 'Generation or captive power licence needed?', 'text'),
          f('reg.emissions', 'Emission and noise limits that apply', 'textarea')
        ] },
        { title: 'Client operations (what you can learn before the meeting)', fields: [
          f('client.shifts', 'Shifts and operating days', 'text'),
          f('client.expansion', 'Known expansion plans', 'textarea'),
          f('target.size_mw', 'Size the client has in mind', 'number', { u: 'MW', calc: 'target', help: 'Leave empty if they have not said. The playbook default is 10 MW.' })
        ] },
        { title: 'First look from the bills', fields: [
          f('bills.max_kw', 'Maximum demand from the bills', 'number', { u: 'kW', help: 'Highest monthly maximum demand. Feeds the first hypothesis until interval data arrives.' }),
          f('bills.annual_mwh', 'Annual consumption from the bills', 'number', { u: 'MWh' })
        ] },
        { title: 'Pre-meeting data request', fields: [
          f('pmr.sent_date', 'Date the short pre-meeting request was sent', 'date', { req: 1 }),
          f('pmr.bills', '12 months of electricity bills received', 'bool'),
          f('pmr.sld', 'Single line diagram received', 'bool'),
          f('pmr.site_plan', 'Site plan received', 'bool'),
          f('pmr.load_data', 'Load data received (BMS, SCADA or utility portal)', 'bool')
        ] },
        { title: 'Meeting pack', fields: [
          f('pack.one_pager', 'Playbook one-page summary ready', 'bool'),
          f('pack.references', '2 or 3 reference projects ready', 'bool'),
          f('pack.configs', 'Typical configurations sheet ready', 'bool'),
          f('pack.indicative_cost', 'Indicative generation cost per MWh ready', 'bool'),
          f('pack.nda', 'NDA signed or not needed', 'bool')
        ] }
      ],
      deliverables: [
        { id: 's0-brief', title: 'Desk research brief', by: 'agent' },
        { id: 's0-request', title: 'Pre-meeting data request (email)', by: 'agent' },
        { id: 's0-hypothesis', title: 'First hypothesis (ballpark)', by: 'cli' },
        { id: 's0-pack', title: 'Meeting pack checklist', by: 'agent' }
      ]
    },
    {
      n: 1, key: 'discovery', short: 'Discover', title: 'Stage 1 · Discovery meeting', when: 'Week 1 (2 to 3 hours plus a site walk)',
      goal: 'Leave the meeting with the client\'s four objective answers, the electrical facts from the SLD, the commercial picture, a site walk record and an agreed data request.',
      groups: [
        { title: 'Meeting', fields: [
          f('s1.meeting_date', 'Meeting date', 'date', { req: 1 }),
          f('s1.attendees', 'Attendees (name, role, company)', 'textarea', { req: 1 })
        ] },
        { title: 'Drivers and constraints (the four answers)', fields: [
          f('obj.drivers', 'Why do they want it?', 'multi', { req: 1, opts: ['Lower energy cost', 'Reliability or backup', 'Power quality', 'Heat or cooling (CHP)', 'Sustainability'] }),
          f('obj.operating_mode', 'How will it run?', 'select', { req: 1, opts: ['Baseload', 'Peak shaving', 'Island (prime power)', 'Backup only'] }),
          f('obj.grid_mode', 'In parallel with the grid or stand-alone?', 'select', { req: 1, opts: ['Grid parallel', 'Stand-alone'] }),
          f('obj.export', 'Export or no export?', 'select', { req: 1, opts: ['Zero export', 'Export allowed', 'Unknown'] }),
          f('obj.gas_source', 'Gas source', 'select', { req: 1, opts: ['Pipeline', 'CNG', 'LNG', 'Biogas or other', 'Unknown'] })
        ] },
        { title: 'Operations', fields: [
          f('ops.min_load_mw', 'Lowest site load (nights, weekends, holidays)', 'number', { u: 'MW', req: 1, help: 'Sets the zero-export limit. Interval data replaces this once it arrives.', fb: 'Ask for the lowest reading on the main incomer meter, or a night-time spot reading.' }),
          f('ops.peak_load_mw', 'Peak site load', 'number', { u: 'MW' }),
          f('ops.shifts', 'Shifts, weekend and holiday operation', 'text'),
          f('ops.critical_loads', 'Critical loads', 'textarea'),
          f('ops.outages', 'Outage history (how often, how long, cost)', 'textarea'),
          f('ops.pq_issues', 'Power quality problems (dips, flicker, harmonics)', 'textarea'),
          f('ops.large_motors', 'Large motors and how they start', 'textarea'),
          f('ops.growth', 'Growth or expansion plans', 'textarea')
        ] },
        { title: 'Electrical (walk through the SLD with their electrical engineer)', fields: [
          f('elec.connection_kv', 'Connection voltage at the candidate bus', 'number', { u: 'kV', req: 1, calc: 'vconn' }),
          f('elec.candidate_bus', 'Candidate tapping point (board and bus section)', 'text'),
          f('elec.spare_bay', 'Spare breaker bay?', 'select', { req: 1, opts: ['Spare bay available', 'Board can be extended', 'No, new generator board needed', 'Unknown'] }),

  // ---------------------------------------------------------------------------
  // Utilities
  // ---------------------------------------------------------------------------
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function nowIso() { return new Date().toISOString().replace(/\.\d+Z$/, 'Z'); }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function empty(v) { return v === null || v === undefined || v === '' || (Array.isArray(v) && v.length === 0); }
  function slugify(s) {
    return String(s || 'project').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'project';
  }
  function fmt(n, d) {
    if (!isNum(n)) return '–';
    d = d === undefined ? 0 : d;
    var s = Math.abs(n).toFixed(d).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? '-' : '') + s.join('.');
  }
  function fmtMoney(n, cur) {
    if (!isNum(n)) return '–';
    var a = Math.abs(n), s;
    if (a >= 1e9) s = fmt(n / 1e9, 2) + ' bn';
    else if (a >= 1e6) s = fmt(n / 1e6, 2) + ' M';
    else if (a >= 1e4) s = fmt(n / 1e3, 0) + ' k';
    else s = fmt(n, 0);
    return (cur ? cur + ' ' : '') + s;
  }
  function percentileSorted(sorted, p) {
    if (!sorted.length) return NaN;
    var idx = (sorted.length - 1) * p, lo = Math.floor(idx), hi = Math.ceil(idx);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
  }
  function pAtLeast(n, k, a) {
    var p = 0;
    for (var i = k; i <= n; i++) {
      var c = 1; for (var j = 1; j <= i; j++) c = c * (n - i + j) / j;
      p += c * Math.pow(a, i) * Math.pow(1 - a, n - i);
    }
    return Math.min(1, p);
  }
  // Expected share of duty capacity available: E[min(X, k)] / k, X ~ Bin(n, a)
  function expectedDutyShare(n, k, a) {
    var e = 0;
    for (var i = 0; i <= n; i++) {
      var c = 1; for (var j = 1; j <= i; j++) c = c * (n - i + j) / j;
      e += c * Math.pow(a, i) * Math.pow(1 - a, n - i) * Math.min(i, k);
    }
    return k > 0 ? e / k : 0;
  }
  function crf(r, n) { return r === 0 ? 1 / n : r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1); }
  function npv(r, flows) { var s = 0; for (var i = 0; i < flows.length; i++) s += flows[i] / Math.pow(1 + r, i); return s; }
  function irr(flows) {
    var lo = -0.99, hi = 1.5, flo = npv(lo, flows), fhi = npv(hi, flows);
    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
    for (var it = 0; it < 200; it++) {
      var mid = (lo + hi) / 2, fm = npv(mid, flows);
      if (Math.abs(fm) < 1e-6) return mid;
      if (fm * flo > 0) { lo = mid; flo = fm; } else { hi = mid; }
    }
    return (lo + hi) / 2;
  }

      stages: STAGES.map(function (s) { return { n: s.n, status: s.n === 0 ? 'in_progress' : 'not_started', started: s.n === 0 ? t : null, completed: null, skip_reason: null }; }),
      current_stage: 0,
      load: null, bills: [],
      tariff_periods: [],
      engine_classes: clone(ENGINE_CLASSES),
      data_request: DATA_REQUEST.map(function (d) { return { id: d.id, item: d.item, why: d.why, owner: d.owner, due: d.due, status: 'Not requested', received: '', note: '', fallback: d.fallback, ex: d.ex }; }),
      exercises: EXERCISES.map(function (e) { return { id: e.id, status: 'Not started', note: '' }; }),
      checks: SLD_CHECKS.map(function (c) { return { id: c.id, status: 'Not checked', note: '' }; }),
      gas_options: [
        { name: 'Pipeline gas', price: null, note: 'Leave the price empty to use the project gas price' },
        { name: 'Trucked CNG (virtual pipeline)', price: null, note: '' },
        { name: 'LNG with storage and vaporizer', price: null, note: '' }

      assumptions: [], risks: clone(RISKS), schedule: clone(SCHEDULE), review: clone(REVIEW),
      selected_options: [],
      deliverables: [], log: [], results: null

    if (opts.client) p.fields['client.name'] = opts.client;

  function addLog(p, text, who) {

  // Fill in anything missing from older or hand-edited files.
  function migrate(p) {

    if (!isNum(p.current_stage)) p.current_stage = 0;
    ['data_request', 'exercises', 'checks'].forEach(function (k) {
      if (!Array.isArray(p[k])) { p[k] = base[k]; return; }

  function parseProject(text) {

  // Parse a raw value for a field according to its type.

    if (raw === null || raw === undefined) return null;

  function setField(p, key, raw, who) {

    if (v !== null && p.unknown) delete p.unknown[key];

    return v;
  }

  function setUnknown(p, key, note, who) {
    if (!FIELDS[key]) throw new Error('Unknown field "' + key + '".');
    p.unknown = p.unknown || {};

    delete p.fields[key];
    addLog(p, 'Marked ' + key + ' unknown: ' + (note || ''), who);

    var v = p.fields[key];

    return !empty(v) || !!(p.unknown && p.unknown[key]);

  // ---------------------------------------------------------------------------
  // Stage progress and gating
  // ---------------------------------------------------------------------------
  function stageProgress(p, n) {
    var s = STAGES[n], req = [], missing = [], filled = 0, total = 0;
    s.groups.forEach(function (g) {
      g.fields.forEach(function (fd) {
        total++;
        if (answered(p, fd.k)) filled++;
        if (fd.req) { req.push(fd.k); if (!answered(p, fd.k)) missing.push(fd.k); }
      });
    });

    if (n === 2) {
      p.data_request.forEach(function (d) {

    }
    if (n === 3) {
      p.exercises.forEach(function (e) { if (e.status !== 'Done' && e.status !== 'Not applicable') extra.push(e.id + ' ' + exTitle(e.id) + ' (' + e.status + ')'); });
      p.review.forEach(function (r) { if (r.status !== 'Approved') extra.push('Review: ' + r.role + ' (' + r.status + ')'); });

    if (n === 2) pct = Math.round(100 * (reqDone + p.data_request.length - extra.length) / Math.max(1, req.length + p.data_request.length));

  function exTitle(id) { var e = EXERCISES.filter(function (x) { return x.id === id; })[0]; return e ? e.title : id; }

  function setStage(p, n, action, reason, who) {
    var st = p.stages[n];

        if (p.stages[i].status !== 'complete' && p.stages[i].status !== 'skipped')
          throw new Error('Stage ' + i + ' is not complete or skipped. Complete it, or skip it only if the user asks to.');
      }

    } else if (action === 'skip') {

      if (n + 1 < STAGES.length && p.stages[n + 1].status === 'not_started') { p.stages[n + 1].status = 'in_progress'; p.stages[n + 1].started = t; }
      p.current_stage = Math.min(n + 1, STAGES.length - 1);
    } else if (action === 'reopen') {
      st.status = 'in_progress'; st.completed = null; p.current_stage = n;
    } else throw new Error('Unknown stage action ' + action);
    addLog(p, 'Stage ' + n + ' ' + action + (reason ? ' (' + reason + ')' : ''), who);
  }

  function addDeliverable(p, d, who) {
    p.deliverables = (p.deliverables || []).filter(function (x) { return x.id !== d.id; });
    p.deliverables.push({ id: d.id, stage: d.stage, title: d.title, markdown: d.markdown, updated: nowIso() });
    addLog(p, 'Saved deliverable ' + d.id + ' ' + d.title, who);
  }

  // ---------------------------------------------------------------------------
  // Load data import
  // ---------------------------------------------------------------------------
  function splitCsvLine(line, d) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {

        else cur += c;
      } else if (c === '"') q = true;

    out.push(cur);

  }
  function detectDelimiter(lines) {
    var best = ',', bestScore = -1;
    [',', ';', '\t', '|'].forEach(function (d) {
      var counts = lines.slice(0, 20).map(function (l) { return l.split(d).length - 1; });
      var min = Math.min.apply(null, counts);

  }
  var DT_ISO = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?\s*(Z|[+-]\d{2}:?\d{2})?)?$/i;
  var DT_DMY = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?)?$/i;
  var TIME_ONLY = /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i;

  function parseDateTime(s, order) {

    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));

    if (m) {
      var a = +m[1], b = +m[2], y = +m[3];

      var day = order === 'mdy' ? b : a, mon = order === 'mdy' ? a : b;
      var h = +(m[4] || 0);
      if (m[7]) { var pm = m[7].toUpperCase() === 'PM'; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; }

  function parseTimeOfDay(s) {

    if (m[4]) { var pm = m[4].toUpperCase() === 'PM'; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; }

  /*
   * Parse a CSV of interval readings into points [{t, v}] (t = ms, naive local time

   * valueColumn (index or header name).

  function parseLoadCsv(text, opts) {
    opts = opts || {};

    var timeCol = -1;
    var t0 = parseDateTime(data[0][0], order);
    if (isNaN(t0)) throw new Error('Could not read a date in the first column: "' + data[0][0] + '". Put the timestamp in the first column.');
    if (data[0].length > 2 && !isNaN(parseTimeOfDay(data[0][1]))) timeCol = 1;

    var vcol = -1;

      else if (header) vcol = header.findIndex(function (h) { return h.toLowerCase() === String(opts.valueColumn).toLowerCase(); });

    var points = pts.map(function (p) { return { t: p.t, kw: toKw(p.v) }; });

  }

    return out;
  }

  // Merge new points into the project's series and resample to a uniform grid.
  function importLoad(p, parsed, fileLabel, opts) {
    opts = opts || {};

    if (parsed.interval_min >= 1440) throw new Error('Daily data is too coarse for load analysis. Use the monthly bills table instead, or get 15 to 60 minute data.');
    var existing = opts.replace ? [] : seriesPoints(p.load);
    if (existing.length && p.load.interval_min !== interval) interval = Math.max(interval, p.load.interval_min);
    var all = existing.concat(parsed.points);
    var step = interval * 60000;
    var tmin = Infinity, tmax = -Infinity;

    existing.forEach(function (x) { var i = Math.floor((x.t - tmin) / step); if (!newSet[i]) { sum[i] += x.kw; cnt[i]++; } });
    parsed.points.forEach(function (x) { var i = Math.floor((x.t - tmin) / step); sum[i] += x.kw; cnt[i]++; });

    p.load = { start: new Date(tmin).toISOString().slice(0, 16), interval_min: interval, kw: kw, sources: sources };
    addLog(p, 'Imported load data from ' + (fileLabel || 'upload') + ' (' + parsed.points.length + ' rows, ' + parsed.unit + ', ' + parsed.interval_min + ' min)', opts.who);

  }

  // Monthly bills: [{month:'2025-01', kwh, max_kw, cost}]
  function parseBillsCsv(text) {
    var lines = String(text).replace(/^﻿/, '').split(/\r\n|\n|\r/).filter(function (l) { return l.trim() !== ''; });
    var d = detectDelimiter(lines);
    var head = splitCsvLine(lines[0], d).map(function (h) { return h.toLowerCase(); });
    var col = function (re) { return head.findIndex(function (h) { return re.test(h); }); };
    var cm = col(/month|period|date/), ck = col(/kwh|energy|consumption/), cx = col(/max|demand|kw\b|md/), cc = col(/cost|amount|bill|total/);

    var out = [];

  // ---------------------------------------------------------------------------

    var lcoe = gen > 0 ? (capTotal * crf(r, N) + fixed + fuel + om) / gen : null;
    var h = v.ppa_irr_pct / 100;
    var ppa = gen > 0 ? (capTotal * crf(h, N) + fixed + fuel + om - heatCredit) / gen : null;
    var avgAvoided = gen > 0 ? avoided / gen : null;
    return {
      capex: capTotal, capexLines: cx.lines, capexPerKw: cx.perKw * mc, genMWh: gen, fuel: fuel, om: om, fixed: fixed, avoided: avoided, demand: demand,
      heatCredit: heatCredit, year1: y1, simplePayback: y1 > 0 ? capTotal / y1 : null, payback: payback, npv: npv(r, flows), irr: irr(flows),

      ppaClientSaving: ppa !== null ? avoided + demand - ppa * gen : null, flows: flows, rows: rows
    };
  }

  function sensitivities(v, opt, d, gh, p, rt) {
    var base = economics(v, opt, d, gh);
    var cases = [
      { name: 'Gas price', lo: '-20%', hi: '+20%', mlo: { gas: 0.8 }, mhi: { gas: 1.2 } },
      { name: 'Grid tariff', lo: '-15%', hi: '+15%', mlo: { tariff: 0.85 }, mhi: { tariff: 1.15 } },
      { name: 'Capex', lo: '-20%', hi: '+20%', mlo: { capex: 0.8 }, mhi: { capex: 1.2 } },
      { name: 'Utilization (energy)', lo: '-15%', hi: '+15%', mlo: { energy: 0.85 }, mhi: { energy: 1.15 } }
    ];
    var out = cases.map(function (c) {
      var a = economics(v, opt, d, gh, c.mlo), b = economics(v, opt, d, gh, c.mhi);
      return { name: c.name, lo: c.lo, hi: c.hi, npvLo: a.npv, npvHi: b.npv, pbLo: a.simplePayback, pbHi: b.simplePayback };
    });
    // availability ±5 points
    var av = [Math.max(50, v.avail - 5), Math.min(100, v.avail + 5)].map(function (a) {
      var share = expectedDutyShare(opt.nTot, opt.nBase, a / 100);
      var e = share / (opt.dutyShare || 1);
      return economics(v, opt, d, gh, { energy: e });
    });
    out.push({ name: 'Unit availability', lo: '-5 pts', hi: '+5 pts', npvLo: av[0].npv, npvHi: av[1].npv, pbLo: av[0].simplePayback, pbHi: av[1].simplePayback });

      detail: 'Gas: ' + (gasAvail || 'not recorded') + '. Cheapest generation cost ' + fmt(Math.min.apply(null, a.options.map(function (o) { return o.genCost; })), 1) + ' vs average tariff ' + fmt(a.tariff.avg_load_weighted || v.tariff, 1) + ' per MWh.' });
    var anyTurn = a.options.some(function (o) { return o.exportOk; });
    g.push({ id: 'G2', title: 'The plant can turn down below the site minimum load (or export is allowed)',
      status: anyTurn ? 'Pass' : 'Fail', detail: 'Site minimum ' + fmt(v.minload, 2) + ' MW (' + (a.src.minload || '') + '). ' + a.options.filter(function (o) { return o.exportOk; }).length + ' of ' + a.options.length + ' options pass.' });

    return g;

  var SRC_LABEL = {
    target: 'Output needed', red: 'Redundancy', pf: 'Power factor', peak: 'Site peak', minload: 'Site minimum load', ambient: 'Hot-day temperature', alt: 'Altitude',

    if (a.ls && a.ls.coverage < 0.95) out.push({ item: 'Load data', assumption: fmt(100 * (1 - a.ls.coverage), 1) + '% of intervals missing', source: 'Gaps skipped and the rest scaled', risk: 'Check the gaps are not shutdowns' });

  // ---------------------------------------------------------------------------
  // Full analysis
  // ---------------------------------------------------------------------------
  function analyse(p) {
    var ls = loadStats(p.load);
    var bs = billsStats(p.bills);
    var r = resolveInputs(p, ls), v = r.v;
    var der = derate(v);
    var classes = (p.engine_classes || []).filter(function (c) { return isNum(c.mw) && c.mw > 0 && isNum(c.eff) && c.eff > 0; });
    var tar = tariffAnalysis(p, v, ls);
    var rt = tar.table;
    var options = classes.map(function (c) {
      var o = sizeOption(v, c, der.pct);
      o.dispatch = dispatch(p, v, o, rt);
      o.elec = electrical(p, v, o, r.src);
      var gh = gasHeat(p, v, o, o.dispatch);
      o.gas = gh.gas; o.heat = gh.heat;
      var sens = sensitivities(v, o, o.dispatch, gh, p, rt);
      o.econ = sens.base; o.sens = sens.cases;
      o.pass = o.exportOk && o.faultOk && o.availOk;
      return o;
    });
    var ranked = options.slice().sort(function (a, b) {
      if (a.pass !== b.pass) return a.pass ? -1 : 1;
      var pa = a.econ.simplePayback === null ? Infinity : a.econ.simplePayback, pb = b.econ.simplePayback === null ? Infinity : b.econ.simplePayback;
      return pa - pb;
    });
    var best = ranked[0] && ranked[0].pass && ranked[0].econ.simplePayback !== null ? ranked[0] : null;
    var sel = (p.selected_options || []).map(function (id) { return options.filter(function (o) { return o.id === id; })[0]; }).filter(Boolean);
    if (!sel.length) sel = ranked.slice(0, 2);
    var a = { v: v, src: r.src, derate: der, ls: ls, bills: bs, tariff: tar, options: options, ranked: ranked, best: best, selected: sel };
    a.gates = gates(p, v, a);
    a.assumptions = autoAssumptions(p, a);
    a.suggested_size = ls ? { base_p05: ls.p05, p10: ls.p10, note: 'For zero export, keep the lowest stable output (one unit at minimum load) below the site minimum, and the duty capacity near the base load for high utilization.' } : null;
    return a;
  }

    ['data-request', 's2-request', 2, 'Formal data request (table and email)', 'dataRequestMd'], ['results', 's3-results', 3, 'Exercise results summary (E1 to E14)', 'resultsMd'], ['proposal', 's4-proposal', 4, 'Proposal package (draft)', 'proposalMd']];
  function vDeliverables() {
    var s = '<div class="card"><h3>Generate from the project data</h3><p class="small muted">These are built from the numbers and answers in the file and saved into it, so the agent sees them too. Regenerate after the data changes. The agent writes the narrative deliverables (briefs, emails, notes).</p><div class="toolbar">' +
      GEN.map(function (g) { return '<button class="btn small" data-act="gen-doc" data-kind="' + g[0] + '">Stage ' + g[2] + ': ' + esc(g[3]) + '</button>'; }).join('') +
      '<button class="btn small" data-act="dl-dr-csv">Data request (CSV)</button></div></div>';
    var list = (P.deliverables || []).slice().sort(function (a, b) { return a.stage - b.stage || (a.id < b.id ? -1 : 1); });
    s += '<div class="card"><h3>Saved in this project (' + list.length + ')</h3>' + (list.length ? '<table><tr><th>Stage</th><th>Deliverable</th><th>Updated</th><th></th></tr>' + list.map(function (d) {
      return '<tr><td>' + d.stage + '</td><td><b>' + esc(d.title) + '</b> <span class="faint small">' + esc(d.id) + '</span></td><td class="small">' + esc((d.updated || '').replace('T', ' ').slice(0, 16)) + '</td><td style="white-space:nowrap"><button class="btn small" data-act="view-doc" data-id="' + esc(d.id) + '">View</button> <button class="btn small" data-act="dl-doc" data-id="' + esc(d.id) + '">Download .md</button> <button class="btn small danger" data-act="del-doc" data-id="' + esc(d.id) + '">Delete</button></td></tr>';
    }).join('') + '</table><div class="toolbar" style="margin-top:8px"><button class="btn small" data-act="dl-all-docs">Download all as one .md</button></div>' : '<div class="empty">None yet.</div>') + '</div>';
    var d = docView && list.filter(function (x) { return x.id === docView; })[0];
    if (d) s += '<div class="card md"><div class="toolbar" style="justify-content:flex-end"><button class="btn small" data-act="close-doc">Close</button></div>' + mdToHtml(d.markdown) + '</div>';
    return s;
  }
  function vLog() {
    return '<div class="card"><h3>Activity log</h3><p class="small muted">Who changed what, from the dashboard or the agent. Last 500 entries.</p><table class="small"><tr><th>When (UTC)</th><th>Who</th><th>What</th></tr>' + (P.log || []).slice().reverse().map(function (l) { return '<tr><td style="white-space:nowrap">' + esc(l.t.replace('T', ' ').slice(0, 16)) + '</td><td>' + esc(l.who) + '</td><td>' + esc(l.text) + '</td></tr>'; }).join('') + '</table></div>';
  }

  // minimal markdown → html (headings, lists, tables, bold, italics, code, paragraphs)
  function inline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])_(.+?)_(?=[^\w]|$)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function mdToHtml(md) {
    var lines = String(md).split('\n'), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^#{1,4} /.test(l)) { var lv = l.match(/^#+/)[0].length; out.push('<h' + lv + '>' + inline(l.replace(/^#+ /, '')) + '</h' + lv + '>'); i++; continue; }
      if (/^\|/.test(l)) {
        var rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function (r) { return r.replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, '|'); }); };
        var h = cells(rows[0]), body = rows.slice(2);
        out.push('<div class="tw"><table><tr>' + h.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr>' + body.map(function (r) { return '<tr>' + cells(r).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>');
        continue;
      }
      if (/^\s*[-*] /.test(l)) {
        var items = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*] /, '').replace(/^\[( |x)\] /, function (m, x) { return x === 'x' ? '☑ ' : '☐ '; })); i++; }
        out.push('<ul>' + items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>'); continue;
      }
      if (/^\s*\d+\. /.test(l)) {
        var oi = []; while (i < lines.length && /^\s*\d+\. /.test(lines[i])) { oi.push(lines[i].replace(/^\s*\d+\. /, '')); i++; }
        out.push('<ol>' + oi.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ol>'); continue;
      }
      if (!l.trim()) { i++; continue; }
      var para = []; while (i < lines.length && lines[i].trim() && !/^(#|\||\s*[-*] |\s*\d+\. )/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  // ------------------------------------------------------------------ CSV helpers
  function csvEsc(x) { x = String(x === null || x === undefined ? '' : x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }
  function seriesCsv() {
    var L = P.load, t0 = Date.parse(L.start + 'Z'), st = L.interval_min * 60000, rows = ['timestamp,load_kW'];
    for (var i = 0; i < L.kw.length; i++) rows.push(new Date(t0 + i * st).toISOString().slice(0, 16).replace('T', ' ') + ',' + (L.kw[i] === null ? '' : L.kw[i]));
    return rows.join('\n') + '\n';
  }
  function monthlyCsv() { return ['month,MWh,max_MW,min_MW,mean_MW'].concat(A.ls.monthly.map(function (m) { return [m.month, m.mwh.toFixed(1), m.max.toFixed(3), m.min.toFixed(3), m.mean.toFixed(3)].join(','); })).join('\n') + '\n'; }

  function importCsvFiles(files) {
    var unit = $('imp-unit') ? $('imp-unit').value : 'auto', order = $('imp-order') ? $('imp-order').value : 'auto', col = $('imp-col') ? $('imp-col').value.trim() : '', replace = $('imp-replace') && $('imp-replace').checked;
    var list = Array.prototype.slice.call(files), msgs = [], first = true;
    var next = function () {
      if (!list.length) { changed(); toast(msgs.join(' · ')); return; }
      var file = list.shift();
      file.text().then(function (text) {
        try {
          var parsed = B.parseLoadCsv(text, { unit: unit, dateOrder: order, valueColumn: col || null });
          B.importLoad(P, parsed, file.name, { replace: replace && first, who: 'dashboard' }); first = false;
          msgs.push(file.name + ': ' + parsed.points.length + ' rows, ' + parsed.unit + ', ' + parsed.interval_min + ' min');
        } catch (e) { toast(file.name + ': ' + e.message, true); }
        next();
      });
    };
    next();
  }

  // ------------------------------------------------------------------ events
  function bindDrop() {
    var d = $('drop'); if (!d || d._b) return; d._b = 1;
    d.addEventListener('dragover', function (e) { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', function () { d.classList.remove('over'); });
    d.addEventListener('drop', function (e) {
      e.preventDefault(); d.classList.remove('over');
      var files = e.dataTransfer.files; if (!files.length) return;
      if (!P || /\.json$/i.test(files[0].name)) files[0].text().then(function (t) { openText(t, files[0].name); });
      else importCsvFiles(files);
    });
  }
  function confirmDiscard(then) {
    if (!P || !dirty) return then();
    modal({ title: 'Unsaved changes', body: '<p>The open project has changes that are not saved to a file. Continue without saving?</p>', ok: 'Continue without saving', onOk: then });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || (b.tagName === 'INPUT' && b.type === 'checkbox')) return;
    var act = b.getAttribute('data-act');
    switch (act) {
      case 'tab': tab = b.getAttribute('data-tab'); renderAll(); window.scrollTo(0, 0); break;
      case 'goto-stage': stageView = +b.getAttribute('data-n'); tab = 'stages'; renderAll(); window.scrollTo(0, 0); break;
      case 'stage-view': stageView = +b.getAttribute('data-n'); renderTab(); break;
      case 'new': confirmDiscard(function () {
        modal({ title: 'New project', body: '<p class="small muted">Give the project a short name. Everything else is asked stage by stage.</p>', input: { label: 'Project name', value: '', required: true }, ok: 'Create', onOk: function (name) {
          var p = B.newProject({ name: name.trim(), by: 'dashboard' }); setProject(p, true); tab = 'stages'; renderAll();
        } });
      }); break;
      case 'open': confirmDiscard(function () { $('openfile').value = ''; $('openfile').click(); }); break;
      case 'save': saveProject(); break;
      case 'demo': fetchDemo(); break;
      case 'restore': var d = readDraft(); if (d) { openText(d.text, d.name); dirty = true; renderChrome(); } break;
      case 'discard-draft': clearDraft(); renderTab(); break;
      case 'unknown': (function () {
        var k = b.getAttribute('data-key');
        if (P.unknown[k]) { delete P.unknown[k]; B.addLog(P, 'Cleared unknown ' + k, 'dashboard'); changed(); return; }
        modal({ title: 'Mark as unknown', body: '<p class="small"><b>' + esc(B.FIELDS[k].l) + '</b></p>' + (B.FIELDS[k].fb ? '<p class="small muted">Playbook fallback: ' + esc(B.FIELDS[k].fb) + '</p>' : ''), input: { label: 'Why it is unknown, and what you will do instead (goes into the assumptions log)', value: '', multiline: true }, ok: 'Mark unknown', onOk: function (note) { B.setUnknown(P, k, note || 'Unknown', 'dashboard'); changed(); } });
      })(); break;
      case 'stage': (function () {
        var op = b.getAttribute('data-op'), n0 = +b.getAttribute('data-n');
        var run = function (reason) { try { B.setStage(P, n0, op, reason || null, 'dashboard'); changed(); toast('Stage ' + n0 + ': ' + op); } catch (err) { toast(err.message, true); } };
        if (op === 'skip') modal({ title: 'Skip stage ' + n0, body: '<p class="small muted">Skip only when you have decided to. The reason is recorded in the project file.</p>', input: { label: 'Reason', value: '', required: true, multiline: true }, ok: 'Skip stage', onOk: run });
        else if (op === 'complete') {
          var pr = B.stageProgress(P, n0);
          if (pr.ready) run();
          else modal({ title: 'Stage ' + n0 + ' has open items', body: '<ul class="small">' + pr.missing.map(function (k) { return '<li>' + esc(B.FIELDS[k].l) + '</li>'; }).concat(pr.extra.map(function (x) { return '<li>' + esc(x) + '</li>'; })).concat(pr.deliverables.filter(function (d) { return !d.done; }).map(function (d) { return '<li>Deliverable: ' + esc(d.title) + '</li>'; })).join('') + '</ul>', input: { label: 'Complete anyway? Give the reason (recorded).', value: '', required: true, multiline: true }, ok: 'Complete with open items', onOk: run });
        } else run();
      })(); break;
      case 'pick-csv': $('csvfile').click(); break;
      case 'pick-bills': $('billsfile').click(); break;
      case 'clear-load': modal({ title: 'Clear load data', body: '<p>Remove all imported interval data from this project?</p>', ok: 'Clear', onOk: function () { P.load = null; B.addLog(P, 'Cleared load data', 'dashboard'); changed(); } }); break;
      case 'clear-bills': P.bills = []; B.addLog(P, 'Cleared bills', 'dashboard'); changed(); break;
      case 'dl-series': saveFile(B.slugify(P.fields['meta.project_name']) + '-load-series.csv', seriesCsv()); break;
      case 'dl-monthly': saveFile(B.slugify(P.fields['meta.project_name']) + '-load-monthly.csv', monthlyCsv()); break;
      case 'del-row': (function () { var arr = getPath(b.getAttribute('data-path')); arr.splice(+b.getAttribute('data-i'), 1); B.addLog(P, 'Removed a row from ' + b.getAttribute('data-path'), 'dashboard'); changed(); })(); break;
      case 'add-tou': P.tariff_periods.push({ name: 'Peak', rate: null, days: 'weekday', from: 8, to: 22 }); changed(); break;
      case 'add-class': P.engine_classes.push({ mw: null, eff: 42, min: 50, kv: 11, om: 13, cx: 1250 }); changed(); break;
      case 'reset-classes': P.engine_classes = JSON.parse(JSON.stringify(B.ENGINE_CLASSES)); changed(); break;
      case 'add-gas': P.gas_options.push({ name: 'New route', price: null, note: '' }); changed(); break;
      case 'add-assumption': P.assumptions.push({ item: '', assumption: '', source: '', risk: '' }); changed(); break;
      case 'add-risk': P.risks.push({ risk: '', effect: '', mitigation: '', l: 'M', i: 'M', owner: '' }); changed(); break;
      case 'add-task': P.schedule.push({ task: 'New task', start: 0, weeks: 4 }); changed(); break;
      case 'add-review': P.review.push({ role: 'Reviewer', name: '', date: '', status: 'Pending', note: '' }); changed(); break;
      case 'gen-doc': (function () {
        var g = GEN.filter(function (x) { return x[0] === b.getAttribute('data-kind'); })[0];
        B.addDeliverable(P, { id: g[1], stage: g[2], title: g[3], markdown: B[g[4]](P) }, 'dashboard'); docView = g[1]; changed(); toast('Generated and saved in the project: ' + g[3]);
      })(); break;
      case 'view-doc': docView = b.getAttribute('data-id'); renderTab(); break;
      case 'close-doc': docView = null; renderTab(); break;
      case 'dl-doc': (function () { var d = P.deliverables.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; saveFile(B.slugify(P.fields['meta.project_name']) + '-' + d.id + '.md', d.markdown); })(); break;
      case 'dl-all-docs': saveFile(B.slugify(P.fields['meta.project_name']) + '-deliverables.md', P.deliverables.slice().sort(function (a, b2) { return a.stage - b2.stage; }).map(function (d) { return d.markdown; }).join('\n\n---\n\n')); break;
      case 'dl-dr-csv': saveFile(B.slugify(P.fields['meta.project_name']) + '-data-request.csv', B.dataRequestCsv(P)); break;
      case 'del-doc': (function () { var id = b.getAttribute('data-id'); modal({ title: 'Delete deliverable', body: '<p>Delete ' + esc(id) + ' from the project?</p>', ok: 'Delete', onOk: function () { P.deliverables = P.deliverables.filter(function (x) { return x.id !== id; }); if (docView === id) docView = null; B.addLog(P, 'Deleted deliverable ' + id, 'dashboard'); changed(); } }); })(); break;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'openfile') { var f = t.files[0]; if (f) f.text().then(function (x) { openText(x, f.name); }); return; }
    if (t.id === 'csvfile') { if (t.files.length) importCsvFiles(t.files); t.value = ''; return; }
    if (t.id === 'billsfile') {
      var bf = t.files[0]; if (!bf) return;
      bf.text().then(function (x) { try { P.bills = B.parseBillsCsv(x); B.addLog(P, 'Imported ' + P.bills.length + ' months of bills', 'dashboard'); changed(); toast(P.bills.length + ' months of bills imported'); } catch (err) { toast(err.message, true); } });
      t.value = ''; return;
    }
    var ac = t.getAttribute('data-act-change');
    if (ac === 'pick-opt') { optId = t.value; renderTab(); return; }
    if (ac === 'sel-opt') {
      var id = t.getAttribute('data-id'), sel = (P.selected_options || []).filter(function (x) { return x !== id; });
      if (t.checked) { if (sel.length >= 2) { toast('Two options at most. Untick one first.', true); t.checked = false; return; } sel.push(id); }
      P.selected_options = sel; B.addLog(P, 'Selected options ' + sel.join(', '), 'dashboard'); changed(); return;
    }
    var key = t.getAttribute('data-field');
    if (key) {
      var fd = B.FIELDS[key], val;
      if (fd.t === 'bool') val = t.checked;
      else if (fd.t === 'multi') val = Array.prototype.slice.call(document.querySelectorAll('[data-field="' + key + '"]')).filter(function (x) { return x.checked; }).map(function (x) { return x.getAttribute('data-multi'); });
      else val = t.value;
      try { B.setField(P, key, fd.t === 'multi' && !val.length ? null : val, 'dashboard'); changed(); } catch (err) { toast(err.message, true); }
      return;
    }
    var path = t.getAttribute('data-path');
    if (path) {
      var v = t.value;
      if (t.getAttribute('data-type') === 'number') v = v === '' ? null : Number(v);
      setPath(path, v); B.addLog(P, 'Set ' + path + ' = ' + v, 'dashboard'); changed();
    }
  });
  window.addEventListener('beforeunload', function (e) { if (P && dirty) { e.preventDefault(); e.returnValue = ''; } });

  function fetchDemo() {
    var p = B.newProject({ name: 'Demo factory 10 MW BTM', client: 'Demo Foods', currency: 'USD', by: 'dashboard' });
    var F = { 'client.industry': 'Food processing', 'team.tsm': 'You', 'site.city': 'Demo City', 'site.country': 'Demo', 'site.altitude_m': 40, 'site.hot_day_temp_c': 34,
      'utility.name': 'Demo Utility', 'tariff.class': 'Industrial MV', 'tariff.energy_rate': 110, 'tariff.demand_charge': 8.5, 'tariff.has_tou': 'Yes', 'gas.availability': 'Pipeline nearby', 'gas.price_per_mmbtu': 7.5,
      'reg.parallel_allowed': 'Yes, with conditions', 'reg.export_allowed': 'No', 'elec.connection_kv': 11, 'elec.switchgear_rating_ka': 16, 'elec.tx_mva': 20, 'elec.tx_z_pct': 10, 'elec.grid_fault_mva': 500, 'elec.motor_ka': 1.5, 'elec.bus_tie': 'Normally open', 'obj.export': 'Zero export' };
    Object.keys(F).forEach(function (k) { B.setField(p, k, F[k], 'dashboard'); });
    p.tariff_periods.push({ name: 'Peak', rate: 140, days: 'weekday', from: 8, to: 22 });
    // synthetic year like assets/sample_load_hourly.csv
    var seed = 42, rnd = function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }, kw = [];
    var t0 = Date.UTC(2025, 0, 1);
    for (var i = 0; i < 8760; i++) {
      var d = new Date(t0 + i * 3600e3), h = d.getUTCHours(), dow = d.getUTCDay(), doy = Math.floor(i / 24), we = dow === 0 || dow === 6;
      var sd = d.getUTCMonth() === 11 && d.getUTCDate() >= 24, season = 1 + 0.06 * Math.sin((doy - 100) / 365 * 2 * Math.PI), mw;
      if (sd) mw = 1.6 + 0.3 * rnd(); else if (we) mw = (dow === 6 && h >= 7 && h < 15) ? 9.5 : 6.2; else if (h >= 7 && h < 23) mw = 13.2 + (h >= 11 && h < 17 ? 1 : 0); else mw = 5.8;
      if (!sd) mw = mw * season + (rnd() - 0.5) * 0.9;
      kw.push(Math.round(mw * 1000));
    }
    p.load = { start: '2025-01-01T00:00', interval_min: 60, kw: kw, sources: [{ file: 'demo (synthetic)', rows: 8760, skipped: 0, unit: 'kW', interval_min: 60, column: 'load_kW', date_order: 'dmy', imported: B.nowIso() }] };
    setProject(p, true);
    tab = 'overview'; renderAll();
  }

  renderAll();
})();
