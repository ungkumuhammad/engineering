<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTM Gas Engine Project Dashboard</title>
<style>
:root{--ink:#1c2230;--muted:#5d6678;--faint:#8a93a5;--line:#dfe3ea;--bg:#f5f6f8;--card:#fff;--accent:#2a62c9;--accent-soft:#e8effc;--amber:#b7790a;--amber-soft:#fdf3df;--green:#1b8a4c;--green-soft:#e3f4ea;--red:#c23b3b;--red-soft:#fbe8e8;--teal:#0f7f84;--violet:#6b4fbb;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9c1cf}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2156b3}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.dirty{font-size:12px;color:var(--amber);font-weight:600}
.saved{font-size:12px;color:var(--green)}
.stages{display:flex;gap:6px;padding:0 18px 10px;overflow-x:auto}
.stg{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;cursor:pointer;text-align:left}
.stg .t{font-size:12px;color:var(--muted)}
.stg .n{font-weight:600}
.stg .pb{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.stg .pb i{display:block;height:100%;background:var(--accent)}
.stg.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stg.complete .pb i{background:var(--green)}
.stg.skipped{opacity:.75}
.stg.skipped .pb i{background:var(--faint)}
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-top:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:18px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card>h3,.card>h2{margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--faint)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:20px;white-space:nowrap}
.chip.ok,.chip.Pass,.chip.Done,.chip.complete,.chip.Received,.chip.Approved{background:var(--green-soft);color:var(--green)}
.chip.bad,.chip.Fail,.chip.Declined{background:var(--red-soft);color:var(--red)}
.chip.warn,.chip.Unknown,.chip.Partial,.chip.in_progress,.chip.Fallback,.chip.Needs,.chip.default{background:var(--amber-soft);color:var(--amber)}
.chip.na,.chip.not_started,.chip.skipped{background:#eef0f4;color:var(--muted)}
.chip.src{background:#eef0f4;color:var(--muted);font-weight:500}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table input,table select,table textarea{width:100%;min-width:60px;border:1px solid transparent;border-radius:6px;padding:3px 5px;background:transparent}
table input:hover,table select:hover,table textarea:hover{border-color:var(--line)}
table input:focus,table select:focus,table textarea:focus{border-color:var(--accent);outline:none;background:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 22px}
.fld{padding:8px 0;border-bottom:1px dashed var(--line)}
.fld label.l{display:flex;gap:6px;align-items:baseline;font-weight:550;font-size:13px}
.fld .req{color:var(--red)}
.fld .row{display:flex;gap:6px;align-items:center;margin-top:4px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{flex:1;width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
.fld textarea{min-height:56px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fld .help{font-size:12px;color:var(--faint);margin-top:3px}
.fld .fb{font-size:12px;color:var(--amber);margin-top:3px}
.fld.unk input,.fld.unk select,.fld.unk textarea{background:var(--amber-soft)}
.fld .u{font-size:12px;color:var(--muted);white-space:nowrap}
.fld .multi{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.fld .multi label,.chk{display:flex;gap:6px;align-items:center;font-weight:400;font-size:13px;cursor:pointer}
.unkbtn{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:3px 6px;cursor:pointer;color:var(--muted)}
.unkbtn.on{background:var(--amber-soft);color:var(--amber);border-color:#f0d9a8}
.grp{margin-top:18px}
.grp>h4{margin-bottom:4px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.note.amber{background:var(--amber-soft)}
.note.red{background:var(--red-soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff}
.opt.best{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.opt h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.opt dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0 0;font-size:12.5px}
.opt dt{color:var(--muted)}.opt dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-size:11px;fill:var(--muted)}
svg.ch .ax{stroke:#c4cad6}
svg.ch .gl{stroke:#eceff4}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.box{height:10px;width:10px}
.heat{width:100%;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line)}
.drop{border:2px dashed #c9d0dc;border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);background:#fbfcfd}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar label{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.toolbar select,.toolbar input[type=text]{border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:#fff}
.md{font-size:13.5px}
.md h1{font-size:20px;margin:6px 0 10px}.md h2{font-size:16px;margin:16px 0 6px}.md h3{font-size:14px;margin:12px 0 4px}
.md table{margin:6px 0 12px}.md p{margin:6px 0}.md ul{margin:4px 0 8px;padding-left:22px}
.md code{background:#f0f2f6;padding:0 4px;border-radius:4px}
.modal-bg{position:fixed;inset:0;background:rgba(20,26,38,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:18px;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:8px}
.modal textarea,.modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;z-index:60;font-size:13px;max-width:90vw}
.toast.err{background:var(--red)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub .btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv b{font-weight:550;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.welcome{max-width:760px;margin:30px auto}
.welcome .card{padding:24px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;background:#fff}
@media (max-width:700px){.g2{grid-template-columns:1fr}main{padding:10px}.form{grid-template-columns:1fr}}
@media print{.top,.btn,.toolbar,.drop{display:none!important}main{max-width:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand">BTM Gas Engine · Project dashboard<small id="projname">No project open</small></div>
    <div class="spacer"></div>
    <span id="dirty"></span>
    <button class="btn" data-act="new">New project</button>
    <button class="btn" data-act="open">Open project file</button>
    <button class="btn primary" data-act="save" id="savebtn" disabled>Save project file</button>
    <input type="file" id="openfile" accept=".json,application/json" hidden>
  </div>
  <div class="stages" id="stages"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<main id="main"></main>
<div id="modal"></div>
<script>/*__ENGINE__*/</script>
<script>
(function () {
  'use strict';
  var B = window.BTM;
  var P = null, A = null, dirty = false, lastSaved = null;
  var tab = 'overview', stageView = 0, optId = null, docView = null, heatMode = 'day';
  var DRAFT_KEY = 'btm-dashboard-draft-v1';
  var TABS = [
    ['overview', 'Overview'], ['stages', 'Stage data'], ['load', 'Load data · E2'], ['tariff', 'Tariff · E3'], ['sizing', 'Sizing · E4'],
    ['electrical', 'Electrical · E5'], ['gas', 'Gas and heat · E6–E7'], ['business', 'Business case · E10–E11'],
    ['registers', 'Registers · E1 E12 E13 E14'], ['deliverables', 'Deliverables'], ['log', 'Log']
  ];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(x, d) { return B.fmt(x, d); }
  function cur() { return (P && P.fields['meta.currency']) || ''; }
  function money(x) { return B.fmtMoney(x, cur()); }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function chip(status, text) { var c = String(status || '').split(/[ :(]/)[0]; return '<span class="chip ' + esc(c) + '">' + esc(text || status) + '</span>'; }

  // ------------------------------------------------------------------ toast + modal
  var toastT = null;
  function toast(msg, err) {
    var t = document.querySelector('.toast'); if (t) t.remove();
    t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, err ? 6000 : 2600);
  }
  function modal(o) {
    // o: {title, body (html), input: {label, value, multiline}, ok, cancel, onOk(value)}
    var m = $('modal');
    var inp = o.input ? (o.input.multiline ? '<textarea id="mdl-in" rows="4">' + esc(o.input.value || '') + '</textarea>' : '<input type="text" id="mdl-in" value="' + esc(o.input.value || '') + '">') : '';
    m.innerHTML = '<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true"><h3>' + esc(o.title) + '</h3><div>' + (o.body || '') + '</div>' +
      (o.input ? '<div class="small muted" style="margin-top:8px">' + esc(o.input.label || '') + '</div>' + inp : '') +
      '<div class="acts">' + (o.cancel === false ? '' : '<button class="btn" id="mdl-no">' + esc(o.cancel || 'Cancel') + '</button>') +
      '<button class="btn primary" id="mdl-ok">' + esc(o.ok || 'OK') + '</button></div></div></div>';
    var close = function () { m.innerHTML = ''; };
    if ($('mdl-no')) $('mdl-no').onclick = close;
    $('mdl-ok').onclick = function () {
      var v = $('mdl-in') ? $('mdl-in').value : null;
      if (o.input && o.input.required && !String(v).trim()) { $('mdl-in').focus(); return; }
      close(); if (o.onOk) o.onOk(v);
    };
    var i = $('mdl-in'); if (i) i.focus(); else $('mdl-ok').focus();
  }

  // ------------------------------------------------------------------ file save / open
  var downloadsP = null;
  function getDownloads() {
    if (downloadsP) return downloadsP;
    downloadsP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(function () { return null; }) : Promise.resolve(null);
    return downloadsP;
  }
  function saveFile(filename, text) {
    return getDownloads().then(function (dl) {
      if (dl) {
        return dl.save({ filename: filename, data: text }).then(function () { return true; }, function (e) {
          if (e && e.code === 'declined') { toast('Save cancelled.'); return false; }
          return fallbackSave(filename, text);
        });
      }
      return fallbackSave(filename, text);
    });
  }
  function fallbackSave(filename, text) {
    try {
      var blob = new Blob([text], { type: /\.json$/.test(filename) ? 'application/json' : /\.csv$/.test(filename) ? 'text/csv' : 'text/markdown' });
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return Promise.resolve(true);
    } catch (e) {
      modal({ title: 'Copy the file contents', body: '<p class="small">This view cannot download files. Copy the text below into a file named <b>' + esc(filename) + '</b>.</p>', input: { value: text, multiline: true }, cancel: false, ok: 'Close' });
      return Promise.resolve(false);
    }
  }
  function saveProject() {
    if (!P) return;
    var text = B.serialize(P);
    saveFile(B.fileName(P), text).then(function (ok) {
      if (ok) { dirty = false; lastSaved = new Date(); clearDraft(); renderChrome(); toast('Saved ' + B.fileName(P) + '. Upload it again to continue later.'); }
    });
  }
  function openText(text, name) {
    try {
      var p = B.parseProject(text);
      setProject(p, false);
      toast('Opened ' + (name || 'project'));
    } catch (e) { toast(e.message, true); }
  }
  function setProject(p, isDirty) {
    P = p; dirty = !!isDirty; optId = null; docView = null;
    stageView = P.current_stage || 0;
    recompute(); renderAll();
  }

  // ------------------------------------------------------------------ draft recovery (this browser only)
  function saveDraft() {
    try { if (P && dirty) localStorage.setItem(DRAFT_KEY, JSON.stringify({ t: new Date().toISOString(), name: B.fileName(P), text: B.serialize(P) })); } catch (e) { /* storage full or blocked */ }
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) { } }
  function readDraft() { try { var d = localStorage.getItem(DRAFT_KEY); return d ? JSON.parse(d) : null; } catch (e) { return null; } }

  // ------------------------------------------------------------------ state changes
  function recompute() { A = P ? B.analyse(P) : null; if (A && (!optId || !A.options.some(function (o) { return o.id === optId; }))) optId = A.selected[0] ? A.selected[0].id : (A.options[0] && A.options[0].id); }
  var renderT = null;
  function changed() {
    dirty = true; recompute(); saveDraft();
    clearTimeout(renderT);
    renderT = setTimeout(function () {
      var ae = document.activeElement, fid = ae && ae.id, ss = null;
      try { ss = ae && ae.selectionStart; } catch (e) { }
      renderChrome(); renderTab();
      if (fid && $(fid)) { var el = $(fid); el.focus(); try { if (ss !== null && ss !== undefined) el.setSelectionRange(ss, ss); } catch (e) { } }
    }, 0);
  }
  function getPath(path) { return path.split('.').reduce(function (o, k) { return o === undefined || o === null ? undefined : o[k]; }, P); }
  function setPath(path, value) {
    var keys = path.split('.'), o = P;
    for (var i = 0; i < keys.length - 1; i++) { if (o[keys[i]] === undefined) o[keys[i]] = {}; o = o[keys[i]]; }
    o[keys[keys.length - 1]] = value;
  }

  // ------------------------------------------------------------------ chrome
  function renderChrome() {
    $('projname').textContent = P ? (P.fields['meta.project_name'] || 'Untitled project') + (P.fields['client.name'] ? ' · ' + P.fields['client.name'] : '') : 'No project open';
    $('savebtn').disabled = !P;
    $('dirty').innerHTML = !P ? '' : dirty ? '<span class="dirty">Unsaved changes</span>' : (lastSaved ? '<span class="saved">Saved ' + lastSaved.toLocaleTimeString() + '</span>' : '');
    if (!P) { $('stages').innerHTML = ''; $('tabs').innerHTML = ''; return; }
    $('stages').innerHTML = B.STAGES.map(function (s) {
      var st = P.stages[s.n], pr = B.stageProgress(P, s.n);
      var cls = 'stg ' + st.status + (P.current_stage === s.n ? ' current' : '');
      return '<button class="' + cls + '" data-act="goto-stage" data-n="' + s.n + '"><div class="t">Stage ' + s.n + ' · ' + esc(st.status.replace('_', ' ')) + '</div><div class="n">' + esc(s.short) + '</div><div class="pb"><i style="width:' + (st.status === 'complete' || st.status === 'skipped' ? 100 : pr.pct) + '%"></i></div></button>';
    }).join('');
    $('tabs').innerHTML = TABS.map(function (t) { return '<button class="tab' + (tab === t[0] ? ' on' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('');
  }
  function renderAll() { renderChrome(); renderTab(); }
  function renderTab() {
    var m = $('main');
    if (!P) { m.innerHTML = welcome(); bindDrop(); return; }
    var fn = { overview: vOverview, stages: vStages, load: vLoad, tariff: vTariff, sizing: vSizing, electrical: vElectrical, gas: vGas, business: vBusiness, registers: vRegisters, deliverables: vDeliverables, log: vLog }[tab] || vOverview;
    m.innerHTML = fn();
    afterRender();
  }
  var post = [];
  function afterRender() { var q = post; post = []; q.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); bindDrop(); }

  function welcome() {
    var d = readDraft();
    return '<div class="welcome"><div class="card"><h2>Start or continue a project</h2>' +
      '<p class="muted">Everything for one project lives in a single file (<code>name.btm.json</code>): stage answers, load data, analysis inputs, registers and the written deliverables. There is no database. Save the file when you stop, and open it again to continue, here or with the agent in Claude.</p>' +
      '<div class="toolbar" style="margin:14px 0"><button class="btn primary" data-act="new">New project</button><button class="btn" data-act="open">Open project file</button><button class="btn" data-act="demo">Open the demo project</button></div>' +
      (d ? '<div class="note amber" style="margin-bottom:12px">Unsaved work from ' + esc(new Date(d.t).toLocaleString()) + ' (' + esc(d.name) + ') is in this browser. <button class="btn small" data-act="restore">Restore it</button> <button class="btn small" data-act="discard-draft">Discard</button></div>' : '') +
      '<div class="drop" id="drop">Or drop a <b>.btm.json</b> project file here</div>' +
      '<h3 style="margin-top:18px">The five stages</h3><ol class="muted">' + B.STAGES.map(function (s) { return '<li><b>' + esc(s.title.replace(/^Stage \d · /, '')) + '</b>: ' + esc(s.goal) + '</li>'; }).join('') + '</ol></div></div>';
  }

  // ------------------------------------------------------------------ field rendering
  function fieldHtml(fd, opts) {
    opts = opts || {};
    var v = P.fields[fd.k], unk = P.unknown && P.unknown[fd.k], id = 'f-' + fd.k.replace(/\./g, '_');
    var ph = opts.placeholder !== undefined ? ' placeholder="' + esc(opts.placeholder) + '"' : '';
    var input;
    if (fd.t === 'bool') {
      return '<div class="fld"><label class="chk"><input type="checkbox" id="' + id + '" data-field="' + fd.k + '"' + (v ? ' checked' : '') + '> ' + esc(fd.l) + (fd.req ? ' <span class="req">*</span>' : '') + '</label>' + (fd.help ? '<div class="help">' + esc(fd.help) + '</div>' : '') + '</div>';
    }
    if (fd.t === 'select') {

    s += '<div class="card"><h3>Saved in this project (' + list.length + ')</h3>' + (list.length ? '<table><tr><th>Stage</th><th>Deliverable</th><th>Updated</th><th></th></tr>' + list.map(function (d) {
      return '<tr><td>' + d.stage + '</td><td><b>' + esc(d.title) + '</b> <span class="faint small">' + esc(d.id) + '</span></td><td class="small">' + esc((d.updated || '').replace('T', ' ').slice(0, 16)) + '</td><td style="white-space:nowrap"><button class="btn small" data-act="view-doc" data-id="' + esc(d.id) + '">View</button> <button class="btn small" data-act="dl-doc" data-id="' + esc(d.id) + '">Download .md</button> <button class="btn small danger" data-act="del-doc" data-id="' + esc(d.id) + '">Delete</button></td></tr>';
    }).join('') + '</table><div class="toolbar" style="margin-top:8px"><button class="btn small" data-act="dl-all-docs">Download all as one .md</button></div>' : '<div class="empty">None yet.</div>') + '</div>';
    var d = docView && list.filter(function (x) { return x.id === docView; })[0];
    if (d) s += '<div class="card md"><div class="toolbar" style="justify-content:flex-end"><button class="btn small" data-act="close-doc">Close</button></div>' + mdToHtml(d.markdown) + '</div>';
    return s;
  }
  function vLog() {
    return '<div class="card"><h3>Activity log</h3><p class="small muted">Who changed what, from the dashboard or the agent. Last 500 entries.</p><table class="small"><tr><th>When (UTC)</th><th>Who</th><th>What</th></tr>' + (P.log || []).slice().reverse().map(function (l) { return '<tr><td style="white-space:nowrap">' + esc(l.t.replace('T', ' ').slice(0, 16)) + '</td><td>' + esc(l.who) + '</td><td>' + esc(l.text) + '</td></tr>'; }).join('') + '</table></div>';
  }

  // minimal markdown → html (headings, lists, tables, bold, italics, code, paragraphs)
  function inline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])_(.+?)_(?=[^\w]|$)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function mdToHtml(md) {
    var lines = String(md).split('\n'), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^#{1,4} /.test(l)) { var lv = l.match(/^#+/)[0].length; out.push('<h' + lv + '>' + inline(l.replace(/^#+ /, '')) + '</h' + lv + '>'); i++; continue; }
      if (/^\|/.test(l)) {
        var rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function (r) { return r.replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, '|'); }); };
        var h = cells(rows[0]), body = rows.slice(2);
        out.push('<div class="tw"><table><tr>' + h.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr>' + body.map(function (r) { return '<tr>' + cells(r).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>');
        continue;
      }
      if (/^\s*[-*] /.test(l)) {
        var items = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*] /, '').replace(/^\[( |x)\] /, function (m, x) { return x === 'x' ? '☑ ' : '☐ '; })); i++; }
        out.push('<ul>' + items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>'); continue;
      }
      if (/^\s*\d+\. /.test(l)) {
        var oi = []; while (i < lines.length && /^\s*\d+\. /.test(lines[i])) { oi.push(lines[i].replace(/^\s*\d+\. /, '')); i++; }
        out.push('<ol>' + oi.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ol>'); continue;
      }
      if (!l.trim()) { i++; continue; }
      var para = []; while (i < lines.length && lines[i].trim() && !/^(#|\||\s*[-*] |\s*\d+\. )/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  // ------------------------------------------------------------------ CSV helpers
  function csvEsc(x) { x = String(x === null || x === undefined ? '' : x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }
  function seriesCsv() {
    var L = P.load, t0 = Date.parse(L.start + 'Z'), st = L.interval_min * 60000, rows = ['timestamp,load_kW'];
    for (var i = 0; i < L.kw.length; i++) rows.push(new Date(t0 + i * st).toISOString().slice(0, 16).replace('T', ' ') + ',' + (L.kw[i] === null ? '' : L.kw[i]));
    return rows.join('\n') + '\n';
  }
  function monthlyCsv() { return ['month,MWh,max_MW,min_MW,mean_MW'].concat(A.ls.monthly.map(function (m) { return [m.month, m.mwh.toFixed(1), m.max.toFixed(3), m.min.toFixed(3), m.mean.toFixed(3)].join(','); })).join('\n') + '\n'; }

  function importCsvFiles(files) {
    var unit = $('imp-unit') ? $('imp-unit').value : 'auto', order = $('imp-order') ? $('imp-order').value : 'auto', col = $('imp-col') ? $('imp-col').value.trim() : '', replace = $('imp-replace') && $('imp-replace').checked;
    var list = Array.prototype.slice.call(files), msgs = [], first = true;
    var next = function () {
      if (!list.length) { changed(); toast(msgs.join(' · ')); return; }
      var file = list.shift();
      file.text().then(function (text) {
        try {
          var parsed = B.parseLoadCsv(text, { unit: unit, dateOrder: order, valueColumn: col || null });
          B.importLoad(P, parsed, file.name, { replace: replace && first, who: 'dashboard' }); first = false;
          msgs.push(file.name + ': ' + parsed.points.length + ' rows, ' + parsed.unit + ', ' + parsed.interval_min + ' min');
        } catch (e) { toast(file.name + ': ' + e.message, true); }
        next();
      });
    };
    next();
  }

  // ------------------------------------------------------------------ events
  function bindDrop() {
    var d = $('drop'); if (!d || d._b) return; d._b = 1;
    d.addEventListener('dragover', function (e) { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', function () { d.classList.remove('over'); });
    d.addEventListener('drop', function (e) {
      e.preventDefault(); d.classList.remove('over');
      var files = e.dataTransfer.files; if (!files.length) return;
      if (!P || /\.json$/i.test(files[0].name)) files[0].text().then(function (t) { openText(t, files[0].name); });
      else importCsvFiles(files);
    });
  }
  function confirmDiscard(then) {
    if (!P || !dirty) return then();
    modal({ title: 'Unsaved changes', body: '<p>The open project has changes that are not saved to a file. Continue without saving?</p>', ok: 'Continue without saving', onOk: then });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || (b.tagName === 'INPUT' && b.type === 'checkbox')) return;
    var act = b.getAttribute('data-act');
    switch (act) {
      case 'tab': tab = b.getAttribute('data-tab'); renderAll(); window.scrollTo(0, 0); break;
      case 'goto-stage': stageView = +b.getAttribute('data-n'); tab = 'stages'; renderAll(); window.scrollTo(0, 0); break;
      case 'stage-view': stageView = +b.getAttribute('data-n'); renderTab(); break;
      case 'new': confirmDiscard(function () {
        modal({ title: 'New project', body: '<p class="small muted">Give the project a short name. Everything else is asked stage by stage.</p>', input: { label: 'Project name', value: '', required: true }, ok: 'Create', onOk: function (name) {
          var p = B.newProject({ name: name.trim(), by: 'dashboard' }); setProject(p, true); tab = 'stages'; renderAll();
        } });
      }); break;
      case 'open': confirmDiscard(function () { $('openfile').value = ''; $('openfile').click(); }); break;
      case 'save': saveProject(); break;
      case 'demo': fetchDemo(); break;
      case 'restore': var d = readDraft(); if (d) { openText(d.text, d.name); dirty = true; renderChrome(); } break;
      case 'discard-draft': clearDraft(); renderTab(); break;
      case 'unknown': (function () {
        var k = b.getAttribute('data-key');
        if (P.unknown[k]) { delete P.unknown[k]; B.addLog(P, 'Cleared unknown ' + k, 'dashboard'); changed(); return; }
        modal({ title: 'Mark as unknown', body: '<p class="small"><b>' + esc(B.FIELDS[k].l) + '</b></p>' + (B.FIELDS[k].fb ? '<p class="small muted">Playbook fallback: ' + esc(B.FIELDS[k].fb) + '</p>' : ''), input: { label: 'Why it is unknown, and what you will do instead (goes into the assumptions log)', value: '', multiline: true }, ok: 'Mark unknown', onOk: function (note) { B.setUnknown(P, k, note || 'Unknown', 'dashboard'); changed(); } });
      })(); break;
      case 'stage': (function () {
        var op = b.getAttribute('data-op'), n0 = +b.getAttribute('data-n');
        var run = function (reason) { try { B.setStage(P, n0, op, reason || null, 'dashboard'); changed(); toast('Stage ' + n0 + ': ' + op); } catch (err) { toast(err.message, true); } };
        if (op === 'skip') modal({ title: 'Skip stage ' + n0, body: '<p class="small muted">Skip only when you have decided to. The reason is recorded in the project file.</p>', input: { label: 'Reason', value: '', required: true, multiline: true }, ok: 'Skip stage', onOk: run });
        else if (op === 'complete') {
          var pr = B.stageProgress(P, n0);
          if (pr.ready) run();
          else modal({ title: 'Stage ' + n0 + ' has open items', body: '<ul class="small">' + pr.missing.map(function (k) { return '<li>' + esc(B.FIELDS[k].l) + '</li>'; }).concat(pr.extra.map(function (x) { return '<li>' + esc(x) + '</li>'; })).concat(pr.deliverables.filter(function (d) { return !d.done; }).map(function (d) { return '<li>Deliverable: ' + esc(d.title) + '</li>'; })).join('') + '</ul>', input: { label: 'Complete anyway? Give the reason (recorded).', value: '', required: true, multiline: true }, ok: 'Complete with open items', onOk: run });
        } else run();
      })(); break;
      case 'pick-csv': $('csvfile').click(); break;
      case 'pick-bills': $('billsfile').click(); break;
      case 'clear-load': modal({ title: 'Clear load data', body: '<p>Remove all imported interval data from this project?</p>', ok: 'Clear', onOk: function () { P.load = null; B.addLog(P, 'Cleared load data', 'dashboard'); changed(); } }); break;
      case 'clear-bills': P.bills = []; B.addLog(P, 'Cleared bills', 'dashboard'); changed(); break;
      case 'dl-series': saveFile(B.slugify(P.fields['meta.project_name']) + '-load-series.csv', seriesCsv()); break;
      case 'dl-monthly': saveFile(B.slugify(P.fields['meta.project_name']) + '-load-monthly.csv', monthlyCsv()); break;
      case 'del-row': (function () { var arr = getPath(b.getAttribute('data-path')); arr.splice(+b.getAttribute('data-i'), 1); B.addLog(P, 'Removed a row from ' + b.getAttribute('data-path'), 'dashboard'); changed(); })(); break;
      case 'add-tou': P.tariff_periods.push({ name: 'Peak', rate: null, days: 'weekday', from: 8, to: 22 }); changed(); break;
      case 'add-class': P.engine_classes.push({ mw: null, eff: 42, min: 50, kv: 11, om: 13, cx: 1250 }); changed(); break;
      case 'reset-classes': P.engine_classes = JSON.parse(JSON.stringify(B.ENGINE_CLASSES)); changed(); break;
      case 'add-gas': P.gas_options.push({ name: 'New route', price: null, note: '' }); changed(); break;
      case 'add-assumption': P.assumptions.push({ item: '', assumption: '', source: '', risk: '' }); changed(); break;
      case 'add-risk': P.risks.push({ risk: '', effect: '', mitigation: '', l: 'M', i: 'M', owner: '' }); changed(); break;
      case 'add-task': P.schedule.push({ task: 'New task', start: 0, weeks: 4 }); changed(); break;
      case 'add-review': P.review.push({ role: 'Reviewer', name: '', date: '', status: 'Pending', note: '' }); changed(); break;
      case 'gen-doc': (function () {
        var g = GEN.filter(function (x) { return x[0] === b.getAttribute('data-kind'); })[0];
        B.addDeliverable(P, { id: g[1], stage: g[2], title: g[3], markdown: B[g[4]](P) }, 'dashboard'); docView = g[1]; changed(); toast('Generated and saved in the project: ' + g[3]);
      })(); break;
      case 'view-doc': docView = b.getAttribute('data-id'); renderTab(); break;
      case 'close-doc': docView = null; renderTab(); break;
      case 'dl-doc': (function () { var d = P.deliverables.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; saveFile(B.slugify(P.fields['meta.project_name']) + '-' + d.id + '.md', d.markdown); })(); break;
      case 'dl-all-docs': saveFile(B.slugify(P.fields['meta.project_name']) + '-deliverables.md', P.deliverables.slice().sort(function (a, b2) { return a.stage - b2.stage; }).map(function (d) { return d.markdown; }).join('\n\n---\n\n')); break;
      case 'dl-dr-csv': saveFile(B.slugify(P.fields['meta.project_name']) + '-data-request.csv', B.dataRequestCsv(P)); break;
      case 'del-doc': (function () { var id = b.getAttribute('data-id'); modal({ title: 'Delete deliverable', body: '<p>Delete ' + esc(id) + ' from the project?</p>', ok: 'Delete', onOk: function () { P.deliverables = P.deliverables.filter(function (x) { return x.id !== id; }); if (docView === id) docView = null; B.addLog(P, 'Deleted deliverable ' + id, 'dashboard'); changed(); } }); })(); break;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'openfile') { var f = t.files[0]; if (f) f.text().then(function (x) { openText(x, f.name); }); return; }
    if (t.id === 'csvfile') { if (t.files.length) importCsvFiles(t.files); t.value = ''; return; }
    if (t.id === 'billsfile') {
      var bf = t.files[0]; if (!bf) return;
      bf.text().then(function (x) { try { P.bills = B.parseBillsCsv(x); B.addLog(P, 'Imported ' + P.bills.length + ' months of bills', 'dashboard'); changed(); toast(P.bills.length + ' months of bills imported'); } catch (err) { toast(err.message, true); } });
      t.value = ''; return;
    }
    var ac = t.getAttribute('data-act-change');
    if (ac === 'pick-opt') { optId = t.value; renderTab(); return; }
    if (ac === 'sel-opt') {
      var id = t.getAttribute('data-id'), sel = (P.selected_options || []).filter(function (x) { return x !== id; });
      if (t.checked) { if (sel.length >= 2) { toast('Two options at most. Untick one first.', true); t.checked = false; return; } sel.push(id); }
      P.selected_options = sel; B.addLog(P, 'Selected options ' + sel.join(', '), 'dashboard'); changed(); return;
    }
    var key = t.getAttribute('data-field');
    if (key) {
      var fd = B.FIELDS[key], val;
      if (fd.t === 'bool') val = t.checked;
      else if (fd.t === 'multi') val = Array.prototype.slice.call(document.querySelectorAll('[data-field="' + key + '"]')).filter(function (x) { return x.checked; }).map(function (x) { return x.getAttribute('data-multi'); });
      else val = t.value;
      try { B.setField(P, key, fd.t === 'multi' && !val.length ? null : val, 'dashboard'); changed(); } catch (err) { toast(err.message, true); }
      return;
    }
    var path = t.getAttribute('data-path');
    if (path) {
      var v = t.value;
      if (t.getAttribute('data-type') === 'number') v = v === '' ? null : Number(v);
      setPath(path, v); B.addLog(P, 'Set ' + path + ' = ' + v, 'dashboard'); changed();
    }
  });
  window.addEventListener('beforeunload', function (e) { if (P && dirty) { e.preventDefault(); e.returnValue = ''; } });

  function fetchDemo() {
    var p = B.newProject({ name: 'Demo factory 10 MW BTM', client: 'Demo Foods', currency: 'USD', by: 'dashboard' });
    var F = { 'client.industry': 'Food processing', 'team.tsm': 'You', 'site.city': 'Demo City', 'site.country': 'Demo', 'site.altitude_m': 40, 'site.hot_day_temp_c': 34,
      'utility.name': 'Demo Utility', 'tariff.class': 'Industrial MV', 'tariff.energy_rate': 110, 'tariff.demand_charge': 8.5, 'tariff.has_tou': 'Yes', 'gas.availability': 'Pipeline nearby', 'gas.price_per_mmbtu': 7.5,
      'reg.parallel_allowed': 'Yes, with conditions', 'reg.export_allowed': 'No', 'elec.connection_kv': 11, 'elec.switchgear_rating_ka': 16, 'elec.tx_mva': 20, 'elec.tx_z_pct': 10, 'elec.grid_fault_mva': 500, 'elec.motor_ka': 1.5, 'elec.bus_tie': 'Normally open', 'obj.export': 'Zero export' };
    Object.keys(F).forEach(function (k) { B.setField(p, k, F[k], 'dashboard'); });
    p.tariff_periods.push({ name: 'Peak', rate: 140, days: 'weekday', from: 8, to: 22 });
    // synthetic year like assets/sample_load_hourly.csv
    var seed = 42, rnd = function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }, kw = [];
    var t0 = Date.UTC(2025, 0, 1);
    for (var i = 0; i < 8760; i++) {
      var d = new Date(t0 + i * 3600e3), h = d.getUTCHours(), dow = d.getUTCDay(), doy = Math.floor(i / 24), we = dow === 0 || dow === 6;
      var sd = d.getUTCMonth() === 11 && d.getUTCDate() >= 24, season = 1 + 0.06 * Math.sin((doy - 100) / 365 * 2 * Math.PI), mw;
      if (sd) mw = 1.6 + 0.3 * rnd(); else if (we) mw = (dow === 6 && h >= 7 && h < 15) ? 9.5 : 6.2; else if (h >= 7 && h < 23) mw = 13.2 + (h >= 11 && h < 17 ? 1 : 0); else mw = 5.8;
      if (!sd) mw = mw * season + (rnd() - 0.5) * 0.9;
      kw.push(Math.round(mw * 1000));
    }
    p.load = { start: '2025-01-01T00:00', interval_min: 60, kw: kw, sources: [{ file: 'demo (synthetic)', rows: 8760, skipped: 0, unit: 'kW', interval_min: 60, column: 'load_kW', date_order: 'dmy', imported: B.nowIso() }] };
    setProject(p, true);
    tab = 'overview'; renderAll();
  }

  renderAll();
})();
